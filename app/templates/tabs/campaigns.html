    <div class="tab-panel" x-show="activeTab==='campaigns'" style="overflow:hidden;">

      <!-- ── Inventory ──────────────────────────────────────────────────────────── -->
      <div class="ov-page" x-show="campaignView==='inventory'">
        <div class="ov-hero" style="background:linear-gradient(135deg,#1e2d4a 0%,#1e3a5f 55%,#1d4ed8 100%);">
          <div class="ov-hero-eyebrow" style="color:#93c5fd;">Primary decision surface</div>
          <h1 class="ov-hero-title">Campaigns</h1>
          <p class="ov-hero-lead" style="color:#bfdbfe;">Each Campaign drives a single Tag dimension to terminus — the point where no records remain in the work queue. Campaigns are the canonical place for staff to work through determinations.</p>
        </div>
        <div style="padding:2rem 2.5rem;max-width:900px;display:flex;flex-direction:column;gap:1.25rem;">
          <template x-for="tag in campaignSortedTags" :key="tag.tag_id">
            <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;"
                 :style="'border-left:4px solid ' + (campaignMeta(tag)?.color || '#94a3b8')">

              <!-- Header row -->
              <div style="padding:1.5rem 1.75rem 1.1rem 2.25rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;">
                <div>
                  <div style="font-size:15px;font-weight:700;color:#0f172a;" x-text="campaignMeta(tag)?.label || tag.name"></div>
                  <div style="font-size:12px;color:#64748b;margin-top:.25rem;" x-text="campaignMeta(tag)?.scope || ('Target: ' + (tag.target_entity || 'any'))"></div>
                </div>
                <button @click="launchCampaignWork(tag)"
                  :style="'font-size:14px;font-weight:600;padding:.6rem 1.4rem;border:none;border-radius:8px;cursor:pointer;flex-shrink:0;white-space:nowrap;color:#fff;line-height:1.5;font-family:inherit;background:' + (campaignMeta(tag)?.color||'#64748b')">
                  Work queue →
                </button>
              </div>

              <!-- Progress + stat strip (real data) -->
              <template x-if="campaignProgress && campaignProgress[tag.name]">
                <div x-data="{
                  get prog()     { return campaignProgress[tag.name]; },
                  get meta()     { return campaignMeta(tag); },
                  get states()   { return tag.states_csv.split(','); },
                  get total()    { return this.prog.total; },
                  get resolved() { return this.total - (this.prog.by_state.find(b => b.state === this.states[0])?.n || 0); },
                  get pct()      { return this.total ? (this.resolved / this.total * 100) : 0; }
                }" style="display:block;width:100%;">
                  <!-- Progress bar + resolved summary -->
                  <div style="padding:0 1.75rem .9rem 2.25rem;display:flex;align-items:center;gap:.75rem;">
                    <div style="flex:1;height:6px;border-radius:3px;background:#f1f5f9;overflow:hidden;">
                      <div :style="'height:100%;width:' + pct.toFixed(1) + '%;background:' + (meta?.color||'#94a3b8') + ';transition:width .4s'"></div>
                    </div>
                    <div style="font-size:12px;color:#64748b;white-space:nowrap;flex-shrink:0;">
                      <span style="font-weight:700;" :style="'color:' + (meta?.color||'#64748b')" x-text="resolved.toLocaleString()"></span>
                      <span x-text="' of ' + total.toLocaleString() + ' resolved'"></span>
                      <span style="color:#94a3b8;" x-text="' (' + pct.toFixed(0) + '%)'"></span>
                    </div>
                  </div>
                  <!-- Stat strip: full card width, edge-to-edge -->
                  <div :style="'display:grid;grid-template-columns:repeat(' + states.length + ',1fr);border-top:1px solid #d1d5db;'">
                    <template x-for="(s, i) in states" :key="s">
                      <div :style="'padding:.75rem .5rem;display:flex;flex-direction:column;align-items:center;' + (i < states.length-1 ? 'border-right:1px solid #d1d5db;' : '') + (i===0 ? 'background:#f1f5f9;' : '')">
                        <div style="font-size:17px;font-weight:700;line-height:1;"
                             :style="i===0 ? ('color:' + (meta?.color||'#64748b')) : 'color:#0f172a;'"
                             x-text="(prog.by_state.find(b => b.state === s)?.n || 0).toLocaleString()"></div>
                        <div style="font-size:10px;color:#64748b;margin-top:.35rem;letter-spacing:.01em;"
                             x-text="s"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Loading / no data yet -->
              <template x-if="!campaignProgress || !campaignProgress[tag.name]">
                <div :style="'display:grid;grid-template-columns:repeat(' + tag.states_csv.split(',').length + ',1fr);border-top:1px solid #d1d5db;'">
                  <template x-for="(s, i) in tag.states_csv.split(',')" :key="s">
                    <div :style="'padding:.75rem .5rem;display:flex;flex-direction:column;align-items:center;' + (i < tag.states_csv.split(',').length-1 ? 'border-right:1px solid #d1d5db;' : '') + (i===0 ? 'background:#f1f5f9;' : '')">
                      <div style="font-size:17px;font-weight:700;color:#cbd5e1;line-height:1;">—</div>
                      <div style="font-size:10px;color:#64748b;margin-top:.35rem;letter-spacing:.01em;"
                           x-text="s"></div>
                    </div>
                  </template>
                </div>
              </template>

            </div>
          </template>
          <template x-if="allTags.length === 0 && !tagsLoading">
            <div style="font-size:13px;color:#94a3b8;">No tag dimensions defined.</div>
          </template>
        </div>
      </div>

      <!-- ── Campaign work surface ──────────────────────────────────────────────── -->
      <div x-show="campaignView==='work'" style="width:100%;display:flex;flex-direction:column;overflow:hidden;">

        <!-- Campaign header -->
        <div style="background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px 10px;flex-shrink:0;"
             :style="'border-left:4px solid ' + (campaignMeta(selectedCampaignTag)?.color || '#d97706')">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;">
            <div style="display:flex;gap:20px;align-items:flex-start;">
              <button @click="campaignView='inventory'"
                style="font-size:12px;font-weight:500;padding:6px 10px;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;background:#fff;color:#475569;margin-top:4px;flex-shrink:0;font-family:inherit;">
                ← Campaigns
              </button>
              <template x-if="selectedCampaignTag">
                <div>
                  <div style="font-size:11px;font-weight:700;letter-spacing:1.2px;margin-bottom:4px;text-transform:uppercase;"
                       :style="'color:' + (campaignMeta(selectedCampaignTag)?.color || '#d97706')"
                       x-text="'CAMPAIGN · ' + (campaignMeta(selectedCampaignTag)?.label || selectedCampaignTag.name).toUpperCase()">
                  </div>
                  <h1 style="margin:0;font-size:22px;font-weight:700;color:#0f172a;letter-spacing:-0.3px;"
                      x-text="campaignMeta(selectedCampaignTag)?.label || selectedCampaignTag.name">
                  </h1>
                  <div style="font-size:13px;color:#64748b;margin-top:2px;"
                       x-text="campaignMeta(selectedCampaignTag)?.scope || selectedCampaignTag.target_entity">
                  </div>
                </div>
              </template>
            </div>
            <!-- Queue position pill -->
            <template x-if="cwFilteredQueue.length > 0">
              <div style="display:flex;align-items:baseline;gap:4px;background:#f8fafc;border:1px solid #e2e8f0;padding:8px 14px;border-radius:8px;flex-shrink:0;">
                <span style="font-size:22px;font-weight:700;color:#0f172a;" x-text="cwIdx+1"></span>
                <span style="color:#94a3b8;font-size:16px;">/</span>
                <span style="font-size:15px;color:#64748b;" x-text="cwFilteredQueue.length"></span>
                <span style="margin-left:6px;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:0.6px;">in queue</span>
              </div>
            </template>
          </div>
          <!-- Progress row -->
          <template x-if="selectedCampaignTag && campaignProgress && campaignProgress[selectedCampaignTag.name]">
            <div x-data="{
              get prog()     { return campaignProgress[selectedCampaignTag.name]; },
              get meta()     { return campaignMeta(selectedCampaignTag); },
              get states()   { return selectedCampaignTag.states_csv.split(','); },
              get total()    { return this.prog.total; },
              get resolved() { return this.total - (this.prog.by_state.find(b => b.state === this.states[0])?.n || 0); },
              get pct()      { return this.total ? (this.resolved / this.total * 100) : 0; }
            }" style="margin-top:12px;display:grid;grid-template-columns:180px auto 1fr;align-items:center;gap:16px;">
              <div style="height:6px;border-radius:999px;background:#f1f5f9;overflow:hidden;">
                <div :style="'height:100%;border-radius:999px;width:' + Math.max(pct, 0.6).toFixed(1) + '%;background:' + (meta?.color||'#d97706') + ';transition:width .4s'"></div>
              </div>
              <div style="font-size:12px;color:#475569;white-space:nowrap;">
                <span style="font-weight:600;" :style="'color:' + (meta?.color||'#d97706')" x-text="resolved.toLocaleString()"></span>
                <span x-text="' of ' + total.toLocaleString() + ' resolved'"></span>
                <span style="color:#94a3b8;margin-left:4px;" x-text="'(' + pct.toFixed(0) + '%)'"></span>
              </div>
              <div style="display:flex;gap:16px;justify-content:flex-end;">
                <template x-for="b in prog.by_state" :key="b.state">
                  <div style="display:flex;gap:6px;align-items:baseline;">
                    <span style="font-size:11px;color:#64748b;" x-text="b.state"></span>
                    <span style="font-size:13px;font-weight:600;" :style="b.n > 0 ? 'color:#0f172a' : 'color:#94a3b8'" x-text="b.n.toLocaleString()"></span>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- 3-col body: grid-template-rows:1fr makes the single implicit row fill the
             container's definite height (from flex:1), giving grid items a definite
             height so nested flex:1 children resolve correctly. -->
        <div style="flex:1;display:grid;grid-template-rows:1fr;overflow:hidden;border-top:1px solid #e2e8f0;"
             :style="{gridTemplateColumns: '260px ' + (cwExpandedPanel ? '1fr' : '1fr 360px')}">

          <!-- Left: queue list -->
          <aside style="background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;">
            <!-- Head -->
            <div style="padding:12px 14px;border-bottom:1px solid #f1f5f9;display:flex;flex-direction:column;gap:8px;flex-shrink:0;">
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <span style="font-size:13px;font-weight:600;">Work queue</span>
                <span style="font-size:11px;color:#64748b;" x-text="cwQueue.length + ' unconfirmed'"></span>
              </div>
              <input x-model.debounce.200ms="cwFilterQuery" placeholder="Filter queue…"
                style="border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;background:#f8fafc;outline:none;" />
              <div style="display:flex;flex-wrap:wrap;gap:4px;">
                <button @click="cwSetFilter('all')"
                  style="font-size:10px;padding:3px 7px;border-radius:999px;font-family:inherit;cursor:pointer;border:1px solid;"
                  :style="cwFilter==='all' ? 'background:#0f172a;color:#fff;border-color:#0f172a;' : 'background:#fff;color:#475569;border-color:#e2e8f0;'">
                  All
                </button>
                <template x-if="selectedCampaignTag?.name === 'IdentityResolution'">
                  <span style="display:contents;">
                    <button @click="cwSetFilter('adb_only')"
                      style="font-size:10px;padding:3px 7px;border-radius:999px;font-family:inherit;cursor:pointer;border:1px solid;"
                      :style="cwFilter==='adb_only' ? 'background:#0f172a;color:#fff;border-color:#0f172a;' : 'background:#fff;color:#475569;border-color:#e2e8f0;'">
                      ADB only
                    </button>
                    <button @click="cwSetFilter('gis_only')"
                      style="font-size:10px;padding:3px 7px;border-radius:999px;font-family:inherit;cursor:pointer;border:1px solid;"
                      :style="cwFilter==='gis_only' ? 'background:#0f172a;color:#fff;border-color:#0f172a;' : 'background:#fff;color:#475569;border-color:#e2e8f0;'">
                      GIS only
                    </button>
                  </span>
                </template>
                <template x-if="selectedCampaignTag?.name === 'AcquisitionDetermination'">
                  <span style="display:contents;">
                    <button @click="cwSetFilter('possible')"
                      style="font-size:10px;padding:3px 7px;border-radius:999px;font-family:inherit;cursor:pointer;border:1px solid;"
                      :style="cwFilter==='possible' ? 'background:#0f172a;color:#fff;border-color:#0f172a;' : 'background:#fff;color:#475569;border-color:#e2e8f0;'">
                      Possible
                    </button>
                    <button @click="cwSetFilter('likely')"
                      style="font-size:10px;padding:3px 7px;border-radius:999px;font-family:inherit;cursor:pointer;border:1px solid;"
                      :style="cwFilter==='likely' ? 'background:#0f172a;color:#fff;border-color:#0f172a;' : 'background:#fff;color:#475569;border-color:#e2e8f0;'">
                      Likely
                    </button>
                  </span>
                </template>
              </div>
            </div>
            <!-- List -->
            <div style="flex:1;overflow:auto;">
              <template x-if="cwQueueLoading">
                <div style="padding:24px;text-align:center;font-size:12px;color:#94a3b8;">Loading queue…</div>
              </template>
              <template x-if="!cwQueueLoading && cwFilteredQueue.length === 0">
                <div style="padding:24px;text-align:center;font-size:12px;color:#94a3b8;">No parcels in queue</div>
              </template>
              <template x-for="(p, i) in cwFilteredQueue" :key="String(p.parcel_id||i)">
                <button @click="cwSelectIdx(i)"
                  style="display:block;width:100%;text-align:left;background:transparent;border:none;border-left:3px solid transparent;border-bottom:1px solid #f1f5f9;padding:10px 12px;cursor:pointer;font-family:inherit;"
                  :style="{
                    background:      i === cwIdx ? '#fffbeb' : 'transparent',
                    borderLeftColor: i === cwIdx
                      ? (campaignMeta(selectedCampaignTag)?.color || '#d97706')
                      : (cwDecisions[p.parcel_id] ? '#10b981' : 'transparent'),
                  }">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:13px;font-weight:600;color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;"
                          x-text="selectedCampaignTag?.name === 'Article97Determination' ? ('Bk ' + p.book + '/' + p.page) : p.parcel_id"></span>
                    <span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;letter-spacing:0.4px;"
                          :style="cwDecisions[p.parcel_id||p.doc_id] ? 'color:#047857;background:#d1fae5;' : 'color:#92400e;background:#fef3c7;'"
                          x-text="cwDecisions[p.parcel_id||p.doc_id] || 'NA'"></span>
                  </div>
                  <div style="font-size:11px;color:#334155;margin-top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                       x-text="selectedCampaignTag?.name === 'Article97Determination' ? (p.instrument_type || '—') : (p.owner_name || '(no owner)')"></div>
                  <div style="font-size:10px;color:#94a3b8;margin-top:3px;">
                    <template x-if="selectedCampaignTag?.name === 'IdentityResolution'">
                      <span><span x-text="p.identity_state === 'ADB-only' ? 'ADB only' : 'GIS only'"></span> · <span x-text="(+(p.billingacres||0)).toFixed(2) + ' ac'"></span></span>
                    </template>
                    <template x-if="selectedCampaignTag?.name === 'CoverageDetermination'">
                      <span><span x-text="p.coverage_estimate || '—'"></span> · <span x-text="(+(p.billingacres||0)).toFixed(2) + ' ac'"></span></span>
                    </template>
                    <template x-if="selectedCampaignTag?.name === 'FarmingDetermination'">
                      <span><span x-text="p.farming_suitability || '—'"></span> · <span x-text="(+(p.billingacres||0)).toFixed(2) + ' ac'"></span></span>
                    </template>
                    <template x-if="selectedCampaignTag?.name === 'AcquisitionDetermination'">
                      <span><span x-text="p.acquisition_suitability || '—'"></span> · <span x-text="(+(p.billingacres||0)).toFixed(2) + ' ac'"></span></span>
                    </template>
                    <template x-if="selectedCampaignTag?.name === 'Article97Determination'">
                      <span x-text="((p.kw_article_97||0)*100).toFixed(0) + '% score'"></span>
                    </template>
                  </div>
                </button>
              </template>
            </div>
          </aside>

          <!-- Center: parcel detail -->
          <main style="overflow:auto;padding:16px 22px;display:flex;flex-direction:column;gap:18px;background:#f3f4f3;"
                :style="{display: cwExpandedPanel ? 'none' : 'flex'}">

            <template x-if="cwDetailLoading">
              <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:32px;text-align:center;font-size:12px;color:#94a3b8;">
                Loading parcel…
              </div>
            </template>

            <template x-if="!cwDetailLoading && cwFilteredQueue.length === 0 && !cwQueueLoading">
              <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:32px;text-align:center;">
                <div style="font-size:13px;font-weight:600;color:#64748b;margin-bottom:4px;">Queue cleared for now</div>
                <div style="font-size:12px;color:#94a3b8;">No unresolved parcels match the current filter.</div>
              </div>
            </template>

            <template x-if="(cwParcelDetail || cwDocDetail) && !cwDetailLoading">
              <div style="display:contents">

              <!-- Parcel strip (all parcel campaigns) -->
              <template x-if="cwParcelDetail">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
                  <div>
                    <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:4px;">PARCEL</div>
                    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">
                      <span style="font-size:22px;font-weight:700;letter-spacing:-0.4px;" x-text="cwParcelDetail.parcel.parcel_id"></span>
                      <span style="font-size:13px;color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;"
                            x-text="cwParcelDetail.parcel.site_addr || '(no address)'"></span>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
                      <template x-if="cwParcelDetail.parcel.owner_category">
                        <span style="font-size:10px;font-weight:700;color:#475569;background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 6px;border-radius:3px;letter-spacing:0.6px;"
                              x-text="cwParcelDetail.parcel.owner_category.toUpperCase()"></span>
                      </template>
                      <template x-if="cwParcelDetail.parcel.is_public">
                        <span style="font-size:10px;font-weight:700;color:#475569;background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 6px;border-radius:3px;letter-spacing:0.6px;">PUBLIC</span>
                      </template>
                      <template x-if="cwParcelDetail.parcel.use_code_norm">
                        <span style="font-size:10px;font-weight:700;color:#475569;background:#f1f5f9;border:1px solid #e2e8f0;padding:2px 6px;border-radius:3px;letter-spacing:0.6px;"
                              x-text="cwParcelDetail.parcel.use_code_norm.toUpperCase()"></span>
                      </template>
                      <span style="font-size:11px;color:#64748b;"
                            x-text="(+(cwParcelDetail.parcel.billingacres||0)).toFixed(2) + ' ac · ' + (cwParcelDetail.parcel.village||'')"></span>
                    </div>
                  </div>
                  <button @click="cwOpenFullParcel(cwParcelDetail.parcel.parcel_id)"
                    style="font-size:12px;color:#1d4ed8;background:none;border:none;cursor:pointer;font-weight:500;margin-top:4px;white-space:nowrap;flex-shrink:0;font-family:inherit;padding:0;">
                    Open full parcel →
                  </button>
                </div>
              </template>

              <!-- Document strip (Article 97) -->
              <template x-if="cwDocDetail">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
                  <div>
                    <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:4px;">DOCUMENT</div>
                    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">
                      <span style="font-size:20px;font-weight:700;letter-spacing:-0.4px;font-family:'IBM Plex Mono',monospace;"
                            x-text="'Bk ' + cwDocDetail.document.book + '/' + cwDocDetail.document.page"></span>
                      <span style="font-size:13px;color:#334155;text-transform:uppercase;"
                            x-text="cwDocDetail.document.instrument_type || '—'"></span>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:#64748b;">
                      <span x-text="cwDocDetail.document.recorded_date?.slice(0,10) || '—'"></span>
                      <template x-if="pnDocPartyLine(cwDocDetail.document)">
                        <span x-text="pnDocPartyLine(cwDocDetail.document)"></span>
                      </template>
                    </div>
                  </div>
                  <template x-if="cwDocDetail.document.parcel_id">
                    <button @click="cwOpenFullParcel(cwDocDetail.document.parcel_id)"
                      style="font-size:12px;color:#1d4ed8;background:none;border:none;cursor:pointer;font-weight:500;margin-top:4px;white-space:nowrap;flex-shrink:0;font-family:inherit;padding:0;">
                      Open parcel →
                    </button>
                  </template>
                </div>
              </template>

              <!-- Decision -->
              <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">DECISION</div>
                <div style="position:relative;display:inline-block;" @click.outside="cwChipOpen=false">
                  <!-- Chip -->
                  <button @click="cwChipOpen=!cwChipOpen"
                    style="border:1px solid;border-radius:8px;min-width:240px;cursor:pointer;text-align:left;font-family:inherit;padding:10px 12px;"
                    :style="{
                      borderColor: cwDecisions[cwCurrentEntityId] ? (campaignMeta(selectedCampaignTag)?.color||'#d97706') : '#e2e8f0',
                      background:  cwDecisions[cwCurrentEntityId] ? '#fef3c7' : '#fff',
                    }">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                      <span style="font-size:10px;font-weight:700;letter-spacing:1.4px;color:#475569;" x-text="cwDimLabel()"></span>
                      <span style="font-size:10px;font-weight:700;letter-spacing:0.8px;padding:2px 8px;border-radius:4px;"
                            :style="cwDecisions[cwCurrentEntityId]
                              ? 'background:' + (campaignMeta(selectedCampaignTag)?.color||'#d97706') + ';color:#fff;'
                              : 'background:#fef3c7;color:#92400e;'"
                            x-text="cwDecisions[cwCurrentEntityId] || 'NA'"></span>
                    </div>
                    <div style="font-size:15px;font-weight:600;color:#0f172a;font-style:italic;margin-bottom:4px;"
                         x-text="cwDecisions[cwCurrentEntityId] || 'Unconfirmed'"></div>
                    <div style="font-size:11px;color:#64748b;display:flex;justify-content:space-between;align-items:center;">
                      <span x-text="campaignMeta(selectedCampaignTag)?.scope || 'Set determination'"></span>
                      <span x-text="cwChipOpen ? '▴' : '▾'" style="color:#94a3b8;"></span>
                    </div>
                  </button>
                  <!-- Popover -->
                  <div x-show="cwChipOpen" @click.stop
                    style="position:absolute;top:calc(100% + 6px);left:0;width:340px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 12px 32px -8px rgba(15,23,42,.18);padding:12px;z-index:50;">
                    <div style="font-size:13px;font-weight:600;color:#0f172a;"
                         x-text="'Set ' + (campaignMeta(selectedCampaignTag)?.label || cwDimLabel()) + ' determination'"></div>
                    <div style="font-size:11px;color:#64748b;margin-top:2px;margin-bottom:10px;"
                         x-text="campaignMeta(selectedCampaignTag)?.scope || 'Choose the determination for this item.'"></div>
                    <div style="display:flex;flex-direction:column;gap:6px;">
                      <template x-for="d in cwDecisionOptions()" :key="d.key">
                        <button @click="cwDecisions = {...cwDecisions, [cwCurrentEntityId]: d.key}; cwChipOpen=false"
                          style="text-align:left;border:1px solid;border-radius:6px;padding:8px 10px;cursor:pointer;font-family:inherit;"
                          :style="{
                            background:  cwDecisions[cwCurrentEntityId]===d.key ? '#fef3c7' : '#fff',
                            borderColor: cwDecisions[cwCurrentEntityId]===d.key ? '#fcd34d' : '#e2e8f0',
                          }">
                          <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:13px;font-weight:600;color:#0f172a;" x-text="d.key"></span>
                            <template x-if="cwSuggestion(cwCurrentParcel) === d.key">
                              <span style="font-size:10px;font-weight:600;letter-spacing:0.4px;"
                                    :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#d97706')">✦ suggested</span>
                            </template>
                          </div>
                          <div style="font-size:11px;color:#64748b;margin-top:2px;" x-text="d.hint"></div>
                        </button>
                      </template>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid #f1f5f9;">
                      <button @click="cwClearDecision(cwCurrentEntityId); cwChipOpen=false"
                        style="background:transparent;border:none;color:#64748b;font-size:12px;cursor:pointer;padding:0;font-family:inherit;">
                        Clear determination
                      </button>
                      <span style="display:flex;align-items:center;gap:3px;font-size:10px;color:#94a3b8;">
                        <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;">1</kbd>
                        <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;">2</kbd>
                        <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;">3</kbd>
                        <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;">4</kbd>
                        to pick
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── Identity evidence ─────────────────────────────────── -->
              <template x-if="selectedCampaignTag?.name === 'IdentityResolution'">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                  <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">IDENTITY EVIDENCE</div>
                  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;">
                    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
                      <span style="font-size:13px;font-weight:600;color:#0f172a;">Owner mismatch</span>
                      <span style="font-size:11px;font-weight:600;letter-spacing:0.4px;"
                            :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#d97706')"
                            x-text="cwParcelDetail.parcel.identity_state === 'ADB-only' ? 'ADB only — missing in GIS' : 'GIS only — missing in ADB'"></span>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;">
                      <!-- ADB card -->
                      <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;display:flex;align-items:center;gap:6px;margin-bottom:6px;text-transform:uppercase;">
                          <span style="width:8px;height:8px;border-radius:999px;background:#d97706;display:inline-block;flex-shrink:0;"></span>
                          ADB · assessor
                        </div>
                        <template x-if="cwParcelDetail.parcel.identity_state !== 'GIS-only'">
                          <div>
                            <div style="font-size:14px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:6px;word-break:break-word;color:#0f172a;"
                                 x-text="cwParcelDetail.parcel.owner_name || '(no name)'"></div>
                            <div style="display:flex;flex-direction:column;gap:3px;">
                              <div style="font-size:11px;color:#64748b;" x-text="'Parcel ' + cwParcelDetail.parcel.parcel_id"></div>
                              <template x-if="cwParcelDetail.parcel.totalapprvalue">
                                <div style="font-size:11px;color:#475569;">
                                  Assessed: <span style="font-weight:600;color:#0f172a;" x-text="'$' + Number(cwParcelDetail.parcel.totalapprvalue).toLocaleString()"></span>
                                </div>
                              </template>
                              <template x-if="cwParcelDetail.parcel.booklast && cwParcelDetail.parcel.pagelast">
                                <div style="font-size:11px;color:#475569;font-family:'IBM Plex Mono',monospace;">
                                  Deed: <span x-text="'Bk ' + cwParcelDetail.parcel.booklast + ' / Pg ' + cwParcelDetail.parcel.pagelast"></span>
                                </div>
                              </template>
                              <template x-if="cwParcelDetail.parcel.parcel_class && cwParcelDetail.parcel.parcel_class !== 'standard'">
                                <div style="font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border:1px solid #fde68a;border-radius:3px;padding:1px 5px;display:inline-block;letter-spacing:0.4px;margin-top:2px;"
                                     x-text="cwParcelDetail.parcel.parcel_class.toUpperCase()"></div>
                              </template>
                            </div>
                          </div>
                        </template>
                        <template x-if="cwParcelDetail.parcel.identity_state === 'GIS-only'">
                          <div style="color:#94a3b8;font-style:italic;font-size:13px;">— no record —</div>
                        </template>
                      </div>
                      <div style="align-self:center;font-size:18px;color:#cbd5e1;font-weight:600;">↔</div>
                      <!-- GIS card -->
                      <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;">
                        <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;display:flex;align-items:center;gap:6px;margin-bottom:6px;text-transform:uppercase;">
                          <span style="width:8px;height:8px;border-radius:999px;background:#1d4ed8;display:inline-block;flex-shrink:0;"></span>
                          GIS · parcel layer
                        </div>
                        <template x-if="cwParcelDetail.parcel.identity_state !== 'ADB-only'">
                          <div>
                            <div style="font-size:14px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:6px;word-break:break-word;color:#0f172a;"
                                 x-text="cwParcelDetail.parcel.owner_name || '(no name)'"></div>
                            <div style="font-size:11px;color:#64748b;"
                                 x-text="(+(cwParcelDetail.parcel.billingacres||0)).toFixed(2) + ' ac'"></div>
                          </div>
                        </template>
                        <template x-if="cwParcelDetail.parcel.identity_state === 'ADB-only'">
                          <div style="color:#94a3b8;font-style:italic;font-size:13px;">— no polygon —</div>
                        </template>
                      </div>
                    </div>

                    <!-- Why this might be -->
                    <div style="margin-top:10px;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;color:#334155;line-height:1.5;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1px;margin-bottom:4px;">WHY THIS MIGHT BE</div>
                      <span x-text="
                        cwParcelDetail.parcel.parcel_class === 'condo-unit'
                          ? 'Condo unit — shares a GIS polygon with its parent parcel. ADB Remove is usually correct here unless the parent is also missing from GIS.'
                          : (+(cwParcelDetail.parcel.billingacres||0)) < 0.1 && cwParcelDetail.parcel.identity_state === 'ADB-only'
                            ? 'Very small lot (under 0.1 ac) — may be a right-of-way, easement, or utility parcel. Verify in GIS before adding a polygon.'
                            : (cwParcelDetail.parcel.parcel_gisid_status && cwParcelDetail.parcel.parcel_gisid_status !== 'matches')
                              ? 'GIS ID status is \'' + cwParcelDetail.parcel.parcel_gisid_status + '\' — the parcel ID in the assessor data may not match what GIS expects.'
                              : cwParcelDetail.parcel.identity_state === 'ADB-only'
                                ? 'No obvious cause. Check Registry of Deeds for deed history' + (cwParcelDetail.parcel.booklast ? ' (Bk ' + cwParcelDetail.parcel.booklast + ' / Pg ' + cwParcelDetail.parcel.pagelast + ')' : '') + '.'
                                : 'No obvious cause. This polygon exists in GIS but has no matching assessor record — may be a recently acquired or exempt parcel.'
                      "></span>
                    </div>

                    <!-- Suggestion -->
                    <div style="margin-top:8px;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;font-size:12px;color:#78350f;line-height:1.5;">
                      <span style="color:#d97706;font-weight:600;">✦ Suggestion:</span>
                      <strong x-text="' ' + (cwSuggestion(cwCurrentParcel) || '—')"></strong>
                      <span x-text="cwParcelDetail.parcel.identity_state === 'ADB-only'
                        ? ' — Owner on ADB but no matching polygon in GIS layer.'
                        : ' — Parcel polygon in GIS but no matching assessor record.'"></span>
                    </div>
                  </div>
                </div>
              </template>

              <!-- ── Coverage evidence ──────────────────────────────────── -->
              <template x-if="selectedCampaignTag?.name === 'CoverageDetermination'">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                  <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">COVERAGE EVIDENCE</div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
                    <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:4px;">ESTIMATE</div>
                      <div style="font-size:15px;font-weight:700;"
                           :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#10b981')"
                           x-text="cwCurrentParcel?.coverage_estimate || '—'"></div>
                    </div>
                    <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:4px;">COVERAGE RATIO</div>
                      <div style="font-size:15px;font-weight:700;color:#0f172a;"
                           x-text="cwParcelDetail.parcel.coverage_ratio != null ? (cwParcelDetail.parcel.coverage_ratio * 100).toFixed(1) + '%' : '—'"></div>
                    </div>
                  </div>
                  <div x-show="cwParcelDetail.parcel.coverage_ratio != null" style="height:6px;border-radius:3px;background:#f1f5f9;overflow:hidden;margin-bottom:12px;">
                    <div :style="'height:100%;width:' + Math.min((cwParcelDetail.parcel.coverage_ratio||0)*100, 100).toFixed(1) + '%;background:' + (campaignMeta(selectedCampaignTag)?.color||'#10b981')"></div>
                  </div>
                  <template x-if="cwSuggestion(cwCurrentParcel)">
                    <div style="padding:10px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;font-size:12px;color:#14532d;line-height:1.5;">
                      <span style="font-weight:600;" :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#10b981')">✦ Suggestion:</span>
                      <strong x-text="' ' + cwSuggestion(cwCurrentParcel)"></strong>
                      <span x-text="' — based on coverage ratio of ' + ((cwParcelDetail.parcel.coverage_ratio||0)*100).toFixed(1) + '%'"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- ── Farming evidence ──────────────────────────────────── -->
              <template x-if="selectedCampaignTag?.name === 'FarmingDetermination'">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                  <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">FARMING EVIDENCE</div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
                    <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:4px;">FARMING SUITABILITY</div>
                      <div style="font-size:15px;font-weight:700;"
                           :style="'color:' + (cwParcelDetail.parcel.farming_suitability && cwParcelDetail.parcel.farming_suitability !== 'Not suitable' ? (campaignMeta(selectedCampaignTag)?.color||'#84cc16') : '#94a3b8')"
                           x-text="cwParcelDetail.parcel.farming_suitability || '—'"></div>
                    </div>
                    <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:4px;">USE CODE</div>
                      <div style="font-size:13px;font-weight:600;color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;"
                           x-text="cwParcelDetail.parcel.use_code_norm || '—'"></div>
                      <div style="font-size:11px;color:#64748b;margin-top:2px;"
                           x-text="cwParcelDetail.parcel.use_code_desc || ''"></div>
                    </div>
                  </div>
                  <template x-if="cwParcelDetail.soil">
                    <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;margin-bottom:12px;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:6px;">SOIL</div>
                      <template x-for="[k,v] in Object.entries(cwParcelDetail.soil).filter(([k])=>!['_loaded_at','parcel_id'].includes(k) && cwParcelDetail.soil[k] != null)" :key="k">
                        <div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;">
                          <span style="color:#64748b;" x-text="k.replace(/_/g,' ')"></span>
                          <span style="color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;" x-text="v"></span>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="cwSuggestion(cwCurrentParcel)">
                    <div style="padding:10px 12px;background:#f7fee7;border:1px solid #d9f99d;border-radius:6px;font-size:12px;color:#365314;line-height:1.5;">
                      <span style="font-weight:600;" :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#84cc16')">✦ Suggestion:</span>
                      <strong x-text="' ' + cwSuggestion(cwCurrentParcel)"></strong>
                      <span x-text="' — based on farming suitability layer value \'' + (cwParcelDetail.parcel.farming_suitability||'—') + '\''"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- ── Acquisition evidence ──────────────────────────────── -->
              <template x-if="selectedCampaignTag?.name === 'AcquisitionDetermination'">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                  <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">ACQUISITION EVIDENCE</div>
                  <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
                    <div>
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:4px;">ACQUISITION SUITABILITY</div>
                      <div style="font-size:17px;font-weight:700;"
                           :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#3b82f6')"
                           x-text="cwParcelDetail.parcel.acquisition_suitability || '—'"></div>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:4px;">APPRAISED VALUE</div>
                      <div style="font-size:15px;font-weight:600;color:#0f172a;"
                           x-text="cwParcelDetail.parcel.totalapprvalue ? '$' + Number(cwParcelDetail.parcel.totalapprvalue).toLocaleString() : '—'"></div>
                    </div>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:12px;">
                    <template x-for="[label, val] in [
                      ['Protected Open Space', cwParcelDetail.parcel.os_acres != null ? Number(cwParcelDetail.parcel.os_acres).toFixed(2) + ' ac' : null],
                      ['BioMap Core Habitat',  cwParcelDetail.parcel.bm3_core_acres != null ? Number(cwParcelDetail.parcel.bm3_core_acres).toFixed(2) + ' ac' : null],
                      ['BioMap CNL',           cwParcelDetail.parcel.bm3_cnl_acres != null ? Number(cwParcelDetail.parcel.bm3_cnl_acres).toFixed(2) + ' ac' : null],
                      ['BioMap Local',         cwParcelDetail.parcel.bm3_local_acres != null ? Number(cwParcelDetail.parcel.bm3_local_acres).toFixed(2) + ' ac' : null],
                      ['Priority Habitat',     cwParcelDetail.parcel.phrs_present != null ? (cwParcelDetail.parcel.phrs_present ? 'Present' : 'Not detected') : null],
                    ].filter(([,v]) => v !== null)" :key="label">
                      <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #f1f5f9;">
                        <span style="color:#64748b;" x-text="label"></span>
                        <span style="font-weight:600;color:#0f172a;" x-text="val"></span>
                      </div>
                    </template>
                  </div>
                  <template x-if="cwSuggestion(cwCurrentParcel)">
                    <div style="padding:10px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:12px;color:#1e3a5f;line-height:1.5;">
                      <span style="font-weight:600;" :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#3b82f6')">✦ Suggestion:</span>
                      <strong x-text="' ' + cwSuggestion(cwCurrentParcel)"></strong>
                      <span x-text="' — suitability is ' + cwParcelDetail.parcel.acquisition_suitability"></span>
                    </div>
                  </template>
                </div>
              </template>

              <!-- ── Article 97 evidence ────────────────────────────────── -->
              <template x-if="selectedCampaignTag?.name === 'Article97Determination' && cwDocDetail">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                  <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">ARTICLE 97 EVIDENCE</div>
                  <div style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;padding:10px 12px;margin-bottom:12px;">
                    <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.8px;margin-bottom:8px;">KEYWORD SCORE</div>
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                      <div style="flex:1;height:8px;border-radius:4px;background:#f1f5f9;overflow:hidden;">
                        <div :style="'height:100%;width:' + Math.min(((cwDocDetail.ocr?.kw_article_97||cwCurrentParcel?.kw_article_97||0)*100), 100).toFixed(1) + '%;background:' + (campaignMeta(selectedCampaignTag)?.color||'#8b5cf6')"></div>
                      </div>
                      <span style="font-size:15px;font-weight:700;"
                            :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#8b5cf6')"
                            x-text="(((cwDocDetail.ocr?.kw_article_97||cwCurrentParcel?.kw_article_97||0))*100).toFixed(0) + '%'"></span>
                    </div>
                    <div style="font-size:11px;color:#64748b;">Score above 40% triggers Article 97 review applicability.</div>
                  </div>
                  <template x-if="cwDocDetail.document.parcel_id">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:#64748b;">
                      <span>Related parcel:</span>
                      <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#0f172a;" x-text="cwDocDetail.document.parcel_id"></span>
                    </div>
                  </template>
                  <div style="padding:10px 12px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:6px;font-size:12px;color:#3b0764;line-height:1.5;">
                    <span style="font-weight:600;" :style="'color:' + (campaignMeta(selectedCampaignTag)?.color||'#8b5cf6')">✦ Suggestion: Confirmed</span>
                    <span> — keyword score exceeds threshold. Review document for Article 97 references before deciding.</span>
                  </div>
                </div>
              </template>

              <!-- Basic info (parcel campaigns only) -->
              <template x-if="cwParcelDetail">
                <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 18px 16px;">
                  <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;margin-bottom:10px;">BASIC INFO</div>
                  <template x-for="row in cwBasicInfoRows(cwParcelDetail.parcel)" :key="row.k">
                    <div style="display:grid;grid-template-columns:120px 1fr 90px;gap:12px;border-bottom:1px solid #f1f5f9;align-items:center;padding:8px 0;">
                      <div style="font-size:12px;color:#64748b;" x-text="row.k"></div>
                      <div style="font-size:13px;color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;" x-text="row.v"></div>
                      <div style="font-size:10px;color:#94a3b8;text-align:right;letter-spacing:0.3px;">↑ Assessor</div>
                    </div>
                  </template>
                </div>
              </template>

              </div>
            </template><!-- /(cwParcelDetail||cwDocDetail) -->
          </main><!-- /center col -->

          <!-- Right: map + actions -->
          <!-- position:relative lets the PDF section use position:absolute;inset:0 when expanded. -->
          <aside style="position:relative;background:#fff;border-left:1px solid #e2e8f0;padding:14px 16px;display:flex;flex-direction:column;gap:12px;"
                 :style="{overflow: cwExpandedPanel ? 'hidden' : 'auto'}">

            <!-- Map section (hidden when PDF is expanded) -->
            <!-- Use static style for display:flex so x-show can safely override it with display:none.
                 Object-form :style only patches flex/minHeight, never touches display. -->
            <div x-show="!cwExpandedPanel || cwExpandedPanel === 'map'"
                 style="display:flex;flex-direction:column;gap:8px;"
                 :style="{flex: cwExpandedPanel === 'map' ? '1' : '', minHeight: cwExpandedPanel === 'map' ? '0' : ''}">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;"
                      x-text="cwParcelDetail ? 'MAP · ' + cwParcelDetail.parcel.parcel_id : (cwDocDetail?.document?.parcel_id ? 'MAP · ' + cwDocDetail.document.parcel_id : 'MAP')"></span>
                <template x-if="cwParcelDetail || cwDocDetail?.document?.parcel_id">
                  <button @click="cwExpandedPanel = cwExpandedPanel === 'map' ? null : 'map'"
                    style="font-size:10px;color:#64748b;background:none;border:1px solid #e2e8f0;border-radius:4px;padding:2px 7px;cursor:pointer;font-family:inherit;line-height:1.6;">
                    <span x-text="cwExpandedPanel === 'map' ? '⤡ Collapse' : '⤢ Expand'"></span>
                  </button>
                </template>
              </div>
              <!-- position:relative must stay in static style — the campaign-map child is
                   position:absolute;inset:0 and depends on this as its containing block. -->
              <div style="position:relative;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;"
                   :style="{flex: cwExpandedPanel === 'map' ? '1' : '', minHeight: cwExpandedPanel === 'map' ? '0' : '', height: cwExpandedPanel === 'map' ? '' : '360px', flexShrink: cwExpandedPanel === 'map' ? '' : '0'}">
                <div id="campaign-map" style="position:absolute;inset:0;"></div>
                <template x-if="!cwParcelDetail && !cwDocDetail">
                  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-size:11px;color:#94a3b8;font-family:'IBM Plex Mono',monospace;">
                    Select a parcel
                  </div>
                </template>
              </div>
            </div>

            <!-- PDF section (Article 97 only, hidden when map is expanded) -->
            <!-- PDF section (Article 97 only, hidden when map is expanded) -->
            <template x-if="selectedCampaignTag?.name === 'Article97Determination' && cwDocDetail && cwDocDetail.document.alis_url">
              <!-- When expanded: position:absolute;inset:0 pins the section to the aside's
                   bounding box (aside is position:relative), giving a concrete size for
                   the flex children inside rather than relying on a 3-level flex:1 chain. -->
              <div x-show="!cwExpandedPanel || cwExpandedPanel === 'pdf'"
                   style="display:flex;flex-direction:column;gap:8px;"
                   :style="{
                     position: cwExpandedPanel === 'pdf' ? 'absolute' : '',
                     inset:    cwExpandedPanel === 'pdf' ? '0'        : '',
                     zIndex:   cwExpandedPanel === 'pdf' ? '1'        : '',
                     background: cwExpandedPanel === 'pdf' ? '#fff'   : '',
                     padding:  cwExpandedPanel === 'pdf' ? '14px 16px': ''
                   }">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:1.2px;"
                        x-text="'DOCUMENT · Bk ' + cwDocDetail.document.book + '/' + cwDocDetail.document.page"></span>
                  <button @click="cwExpandedPanel = cwExpandedPanel === 'pdf' ? null : 'pdf'"
                    style="font-size:10px;color:#64748b;background:none;border:1px solid #e2e8f0;border-radius:4px;padding:2px 7px;cursor:pointer;font-family:inherit;line-height:1.6;">
                    <span x-text="cwExpandedPanel === 'pdf' ? '⤡ Collapse' : '⤢ Expand'"></span>
                  </button>
                </div>
                <!-- PDF iframe — compact in sidebar, full-height when expanded.
                     /rod resolves the PDF URL with an outbound fetch on first load,
                     then serves from _rod_cache so expand/collapse is instant. -->
                <div style="position:relative;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#f8fafc;"
                     :style="{flex: cwExpandedPanel === 'pdf' ? '1' : '', flexShrink: cwExpandedPanel === 'pdf' ? '' : '0', minHeight: cwExpandedPanel === 'pdf' ? '0' : '', height: cwExpandedPanel === 'pdf' ? '' : '200px'}">
                  <iframe :src="'/api/documents/' + cwDocDetail.document.book + '/' + cwDocDetail.document.page + '/rod'"
                          style="position:absolute;inset:0;width:100%;height:100%;border:none;display:block;"
                          title="Registry document PDF">
                    </iframe>
                  </div>
              </div>
            </template>

            <!-- Save & Next -->
            <div style="flex-shrink:0;display:flex;gap:8px;">
              <button @click="cwSkip()"
                style="background:#fff;border:1px solid #e2e8f0;color:#64748b;padding:9px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;flex:1;">
                Skip
              </button>
              <button @click="cwSaveAndNext()"
                :disabled="!cwDecisions[cwCurrentEntityId]"
                style="border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;font-family:inherit;flex:2;color:#fff;"
                :style="cwDecisions[cwCurrentEntityId]
                  ? 'background:' + (campaignMeta(selectedCampaignTag)?.color||'#d97706') + ';cursor:pointer;'
                  : 'background:#cbd5e1;cursor:not-allowed;'">
                Save &amp; Next →
              </button>
            </div>
            <!-- Keyboard hints -->
            <div style="flex-shrink:0;text-align:center;">
              <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;color:#94a3b8;">
                <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;margin:0 2px;">S</kbd> skip ·
                <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;margin:0 2px;">↵</kbd> save ·
                <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;margin:0 2px;">J</kbd>
                <kbd style="font-family:ui-monospace,monospace;font-size:10px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;border-radius:3px;padding:1px 5px;margin:0 2px;">K</kbd> navigate
              </span>
            </div>
          </aside><!-- /right col -->

        </div><!-- /3-col body -->
      </div><!-- /campaign work surface -->

    </div>
