      unique:
        gis_source_key: soil
        label: Farmland of Unique Importance
        display_group: Farming
        display_order: 30
        value_type: presence
      not_prime:
        gis_source_key: soil
        label: Not Prime Farmland
        display_group: Farming
        display_order: 40
        value_type: presence
        filterable: false

  DocumentKeywordScores:
    attr_key: ocr
    class: External
    node_type: document
    db_table: registry_ocr
    build_stage: load_ocr
    label: Registry OCR Keyword Scores
    description: >
      OCR-derived keyword detection scores for Barnstable Registry of Deeds
      documents. Scores are per-document composites in [0.0, 1.0]; a score
      above 0.4 signals likely keyword presence.
    columns:
      kw_conservation_restriction:
        label: Conservation Restriction
        description: Keyword score for conservation restriction language.
        display_group: Legal Restrictions
        display_order: 10
        value_type: numeric
      kw_article_97:
        label: Article 97
        description: >
          Keyword score for Article 97 (Massachusetts constitutional protection
          of publicly funded conservation land) language.
        display_group: Legal Restrictions
        display_order: 20
        value_type: numeric
      kw_deed_restriction:
        label: Deed Restriction
        description: Keyword score for deed restriction language.
        display_group: Legal Restrictions
        display_order: 30
        value_type: numeric
      kw_chapter_61:
        label: Chapter 61
        description: Keyword score for Chapter 61 (forest land) preferential tax assessment language.
        display_group: Legal Restrictions
        display_order: 40
        value_type: numeric
      kw_agricultural_preservation_restriction:
        label: Ag. Preservation Restriction
        description: Keyword score for Agricultural Preservation Restriction (APR) language.
        display_group: Legal Restrictions
        display_order: 50
        value_type: numeric
      kw_perpetual_restriction:
        label: Perpetual Restriction
        description: Keyword score for perpetual restriction language.
        display_group: Legal Restrictions
        display_order: 60
        value_type: numeric
      kw_ccr:
        label: CC&R
        description: Keyword score for Covenants, Conditions & Restrictions language.
        display_group: Legal Restrictions
        display_order: 70
        value_type: numeric

  ParcelForSale:
    attr_key: for_sale
    class: External
    node_type: parcel
    db_table: layer_for_sale
    build_stage: load_for_sale
    label: Active Listings
    description: >
      Active real estate listings from manually-curated HomeForSale.txt.
      The for_sale flag is address-matched at query time (not a stored column
      on parcels); layer_for_sale holds the listing records.
    columns:
      for_sale:
        label: For Sale
        description: Parcel address matches an active listing in the for-sale snapshot.
        display_group: Market
        display_order: 10
        value_type: presence

  ParcelADBGISID:
    attr_key: adb_gisid
    class: External
    node_type: parcel
    db_table: parcels
    build_stage: build_parcels
    label: Assessor Database GIS ID
    description: >
      Raw GIS feature identifier from the Assessor Database (BT_Extract GISID field).
      Carried through the parcel spine as hygiene data. Not used as a join key —
      parcel_id (map-parcel) is the authoritative join key.
    columns:
      parcel_adb_gisid:
        label: ADB GIS ID
        description: >
          Raw GISID from the Assessor Database. F_ prefix = standard parcel loc_id
          (may reflect an older GIS vintage); X_ prefix = special feature
          (road, easement, ROW).
        display_group: Identity
        display_order: 20
        value_type: text
        filterable: false

  # ── Derived Layers ───────────────────────────────────────────────────────────

  ParcelIdentityState:
    attr_key: identity
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: build_parcels
    label: Identity State
    description: >
      Parcel presence across Assessor Database and MassGIS parcel layer.
      Derived from join_status and parcel_class. X_ (special-feature) records
      are always OK — their absence from the GIS parcel layer is correct.
      F_ and no-gisid records use parcel_id presence-in-both as the signal.
    columns:
      identity_state:
        label: Identity State
        description: >
          OK = present in both Assessor and GIS, or special-feature (X_) parcel;
          ADB-only = Assessor only (no GIS polygon);
          GIS-only = MassGIS only (no Assessor record).
        display_group: Identity
        display_order: 10
        value_type: coded

  ParcelClass:
    attr_key: parcel_class
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: build_parcels
    label: Parcel GIS Feature Class
    description: >
      Derived from the ADB GISID prefix. Determines whether GIS absence is
      expected (special-feature) or a data gap (standard / no-gisid).
    columns:
      parcel_class:
        label: Parcel Class
        description: >
          standard = regular parcel; GIS polygon expected (F_ gisid prefix);
          special-feature = road / easement / ROW (X_ prefix; absent from parcel
          GIS layer by design);
          no-gisid = ADB record carries no GIS identifier.
        display_group: Identity
        display_order: 30
        value_type: coded

  ParcelGISIDStatus:
    attr_key: gisid_status
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: build_parcels
    label: GIS ID Match Status
    description: >
      Hygiene signal comparing the ADB GISID against the current MassGIS loc_id.
      Drift parcels (96% of non-matching) are centroid recalculation noise across
      GIS vintages; classified by distance. Not an identity signal; parcel_id is
      the join key.
    columns:
      parcel_gisid_status:
        label: GIS ID Status
        description: >
          matches = gisid resolves to correct GIS loc_id row;
          drift-minor = parcel_id in GIS, gisid stale, centroid shift < 10 ft;
          drift-moderate = centroid shift 10–50 ft;
          drift-major = centroid shift ≥ 50 ft (may indicate polygon reassignment);
          missing = parcel_id not found in GIS (ASSESSOR_ONLY);
          special-feature = X_ prefix (roads/easements/ROW, correctly absent);
          no-gisid = ADB carries no GIS identifier.
        display_group: Identity
        display_order: 40
        value_type: coded

  ParcelMassGISStatus:
    attr_key: massgis_status
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: build_parcels
    label: MassGIS Correction Status
    description: >
      GIS-side hygiene signal — symmetric to ParcelGISIDStatus (which is ADB-side).
      Classifies what correction, if any, MassGIS needs to make for each parcel.
      Feeds the MassGIS Correction Report; not used as an identity signal.
    columns:
      parcel_massgis_status:
        label: MassGIS Status
        description: >
          ok = GIS has the parcel with correct map_par_id (BOTH join);
          absent = ADB parcel has no GIS polygon (ASSESSOR_ONLY, standard);
          blank-map-par-id = GIS has a polygon matching the ADB gisid but
          map_par_id is empty or misassigned;
          unmatched-polygon = GIS polygon with no ADB counterpart (MASSGIS_ONLY);
          special-feature = X_ parcel, correctly absent from GIS parcel layer;
          no-gisid = ADB record has no gisid, no basis for GIS lookup.
        display_group: Identity
        display_order: 50
        value_type: coded

  ParcelCoverageRatio:
    attr_key: coverage
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: coverage
    label: Structure Coverage Ratio
    description: >
      Ratio of total structure footprint area to parcel billing acres.
      Inputs: ParcelStructures (struct_total_sqft) and ParcelAssessor
      (billingacres). Capped at 1.0.
    columns:
      coverage_ratio:
        label: Coverage Ratio
        description: >
          Footprint sq ft / (billing acres × 43,560). Null if either
          input is missing.
        display_group: Coverage
        display_order: 10
        value_type: numeric
      coverage_status:
        label: Coverage Status
        description: "ok | no_structure | no_acreage | data_issue"
        display_group: Coverage
        display_order: 20
        value_type: coded
        filterable: false

  ParcelUndevelopedStateCode:
    attr_key: usc
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: undeveloped_state_code
    label: Undeveloped Use Code Flag
    description: >
      1 if the parcel use code is in the Massachusetts state-defined set of
      undeveloped codes (agricultural, open space, recreational, underwater
      land). Derived from ParcelAssessor use_code_norm.
    columns:
      is_undeveloped_state_code:
        label: Undeveloped State Code
        display_group: Coverage
        display_order: 30
        value_type: presence

  ParcelFarmingSuitability:
    attr_key: farming
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: farming_suitability
    label: Farming Suitability
    description: >
      Three-state farming suitability materialized from ParcelFarmlandClass
      flags and assessor use code. Likely = prime soil; Possible = statewide
      or unique soil, or agricultural use code; Not suitable = otherwise.
      Applicability gate for FarmingDetermination.
    columns:
      farming_suitability:
        label: Farming Suitability
        description: "Likely | Possible | Not suitable"
        display_group: Farming
        display_order: 50
        value_type: coded

  ParcelAcquisitionSuitability:
    attr_key: acquisition
    class: Derived
    node_type: parcel
    db_table: parcels
    build_stage: acquisition_suitability
    label: Acquisition Suitability
    description: >
      Three-state acquisition suitability. Likely = high conservation value
      (BioMap3 core/CNL) + low development pressure + IdentityState OK;
      Possible = any conservation signal; Not suitable = otherwise.
      Applicability gate for AcquisitionDetermination.
    columns:
      acquisition_suitability:
        label: Acquisition Suitability
        description: "Likely | Possible | Not suitable"
        display_group: Acquisition
        display_order: 10
        value_type: coded

