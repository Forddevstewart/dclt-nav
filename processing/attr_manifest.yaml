# processing/attr_manifest.yaml
#
# Authoritative attribute registry for dclt-nav.
#
# Each Layer entry defines:
#   - Provenance: class (External|Derived|Dynamic), db_table, build_stage, gis_source_key
#   - Presentation: label, description, display_group, display_order per column
#
# New layers require a code deploy (loader or compute function). Add the manifest
# entry in the same PR as the code change.
#
# Layer classes:
#   External — loaded from a source file by the build pipeline
#   Derived  — computed from External layers during build; materialized to reference.db
#   Dynamic  — evaluated per-request from tag folds; no DB column
#
# gis_source_key references data/gis_sources/<key>.json (source metadata, org, date).

layers:

  # ── External Layers ──────────────────────────────────────────────────────────

  ParcelGISOverlays:
    attr_key: gis
