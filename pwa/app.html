<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d5a1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>DCLT Field</title>
  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="stylesheet" href="/pwa/css/app.css">
</head>
<body>
  <header>
    <div style="width:60px"></div>
    <h1>DCLT Field</h1>
    <div class="header-right">
      <span class="header-username" id="username-display"></span>
      <button class="btn-ghost" id="logout-btn">Sign out</button>
    </div>
  </header>

  <div id="location-bar" class="location-bar">Detecting location…</div>

  <div class="search-area">
    <input type="search" id="search-input"
           placeholder="Search parcel ID or address…"
           autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div id="results"></div>

  <div id="recents-section">
    <div class="section-header">Recent</div>
    <div id="recents-list"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/pwa/js/app.js"></script>
</body>
</html>
