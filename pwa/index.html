<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d5a1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DCLT Field</title>
  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="stylesheet" href="/pwa/css/app.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>DCLT Field</h1>
    <p class="subtitle">Sign in to continue</p>
    <form id="login-form" autocomplete="on">
      <input type="text" id="username" name="username" placeholder="Username"
             autocomplete="username" required>
      <input type="password" id="password" name="password" placeholder="Password"
             autocomplete="current-password" required>
      <button type="submit" id="submit-btn" class="btn-submit">Sign in</button>
      <p id="error-msg" class="error hidden"></p>
    </form>
  </div>

  <script>
    fetch('/api/pwa/me', { credentials: 'include' })
      .then(r => { if (r.ok) location.replace('/pwa/app.html'); });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.classList.add('hidden');
      try {
        const res = await fetch('/api/pwa/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          location.replace('/pwa/app.html');
        } else {
          err.textContent = 'Invalid username or password.';
          err.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch {
        err.textContent = 'Connection error — please try again.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/pwa/sw.js');
    }
  </script>
</body>
</html>
